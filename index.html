<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Icy Tower 1.0 — Web Port (WASM + TypeScript)</title>
  <meta name="description" content="Authentic reverse engineered web port of Icy Tower 1.0 in WebAssembly, HTML5 Canvas, and TypeScript. Playable on desktop and mobile.">
  <meta name="theme-color" content="#0a0a14">
  <link rel="icon" type="image/png" href="/assets/hero000.png">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0a0a14;
      font-family: 'Courier New', Courier, monospace;
      touch-action: none;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Top Action Bar (Fullscreen, Mute, Language) */
    .top-bar {
      position: fixed;
      top: 12px;
      right: 14px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(20, 20, 35, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.15s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .icon-btn:hover {
      background: rgba(40, 40, 70, 0.9);
      border-color: #ffe040;
      color: #ffe040;
      transform: scale(1.05);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* Mobile Virtual Controls */
    .touch-controls {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 180px;
      pointer-events: none;
      z-index: 90;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 20px 24px 20px;
    }

    .dpad-container {
      pointer-events: auto;
      display: flex;
      gap: 14px;
    }

    .action-container {
      pointer-events: auto;
      display: flex;
    }

    .touch-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(25, 25, 45, 0.65);
      border: 3px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      transition: transform 0.1s ease, background 0.1s ease, border-color 0.1s ease;
    }

    .touch-btn.jump-btn {
      width: 82px;
      height: 82px;
      background: rgba(220, 140, 20, 0.65);
      border-color: rgba(255, 220, 80, 0.6);
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .touch-btn:active {
      transform: scale(0.92);
      background: rgba(255, 224, 64, 0.5);
      border-color: #ffe040;
    }

    .touch-btn.jump-btn:active {
      transform: scale(0.92);
      background: rgba(255, 170, 0, 0.85);
      border-color: #ffffff;
    }

    @media (hover: hover) and (pointer: fine) {
      /* Keep touch buttons visible on desktop with subtle opacity, or hide if desired */
      .touch-controls {
        opacity: 0.85;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- Top Action Controls -->
  <div class="top-bar">
    <button id="btn-lang" class="icon-btn" title="Change Language">EN</button>
    <button id="btn-mute" class="icon-btn" title="Toggle Sound">🔊</button>
    <button id="btn-fullscreen" class="icon-btn" title="Toggle Fullscreen">⤢</button>
  </div>

  <!-- Mobile On-Screen Virtual Controls -->
  <div class="touch-controls">
    <div class="dpad-container">
      <div id="btn-left" class="touch-btn">◀</div>
      <div id="btn-right" class="touch-btn">▶</div>
    </div>
    <div class="action-container">
      <div id="btn-jump" class="touch-btn jump-btn">JUMP</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
